name: my_app
description: "MyApp mobile app (Android and iOS)."
publish_to: 'none'
# The human version. The build number is the commit count (scripts/ci/build_number.sh).
version: 0.1.0+1

environment:
  sdk: ^3.10.0
  # Pinned: CI installs exactly this version (flutter-version-file), and
  # scripts/check.sh warns when your local Flutter differs.
  flutter: 3.47.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  widgetbook: ^3.25.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/Nunito-OFL.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
